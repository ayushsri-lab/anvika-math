<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eerav's Math Fun!</title>
<style>
  :root{
    --bg:#fff7ef;--card:#ffffff;--ink:#3a2f2a;--muted:#9a8b80;
    --good:#57c785;--good-soft:#e4f7ec;--bad:#ff9aa2;
    --shadow:0 6px 18px rgba(120,90,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:"Comic Sans MS","Chalkboard SE",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;user-select:none;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  header.top h1{font-size:26px;margin:0;}
  .stars{background:#fff;border-radius:30px;padding:8px 16px;box-shadow:var(--shadow);font-size:22px;font-weight:800;color:#f4a017;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .tile{border:none;border-radius:26px;padding:24px 14px;cursor:pointer;box-shadow:var(--shadow);color:#fff;font-size:22px;font-weight:800;font-family:inherit;transition:transform .1s;text-align:center;}
  .tile:active{transform:scale(.95);}
  .tile .emo{font-size:50px;display:block;margin-bottom:8px;}
  .tile .lvl{font-size:14px;opacity:.9;display:block;margin-top:6px;font-weight:700;}
  .c1{background:#ff8fab;}.c2{background:#ffb703;}.c3{background:#8ecae6;}.c4{background:#95d5b2;}
  .c5{background:#b298dc;}.c6{background:#ffa552;}.c7{background:#7ec4cf;}

  .card{background:var(--card);border-radius:28px;padding:20px;box-shadow:var(--shadow);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .backbtn{border:none;background:#fff0e0;border-radius:20px;padding:10px 18px;font-size:22px;cursor:pointer;font-family:inherit;font-weight:800;color:#a0754a;}
  .lvbadge{background:#efe6ff;color:#7a52c7;border-radius:20px;padding:10px 18px;font-size:18px;font-weight:800;}

  .qtext{text-align:center;font-size:28px;font-weight:800;margin:10px 0 4px;color:var(--muted);}
  .qbig{text-align:center;font-size:56px;font-weight:900;margin:14px 0 18px;letter-spacing:2px;min-height:70px;}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  .choice{border:4px solid #ffe3c2;background:#fff;border-radius:24px;padding:26px 10px;font-size:44px;font-weight:900;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .08s;min-height:100px;display:flex;align-items:center;justify-content:center;}
  .choice:active{transform:scale(.94);}
  .choice.correct{background:var(--good-soft);border-color:var(--good);}
  .choice.wrong{background:#ffecec;border-color:var(--bad);animation:shake .3s;opacity:.6;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .nextbtn{display:none;width:100%;margin-top:18px;border:none;border-radius:26px;background:#57c785;color:#fff;font-size:28px;font-weight:900;padding:18px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .nextbtn:active{transform:scale(.97);}
  .nextbtn.show{display:block;}

  .celebrate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:50;}
  .celebrate.show{display:flex;}
  .celebrate .msg{font-size:44px;font-weight:900;color:#f4a017;background:#fff;padding:16px 30px;border-radius:30px;box-shadow:var(--shadow);}
  .confetti{position:fixed;top:-40px;font-size:34px;animation:fall 1.4s linear forwards;z-index:49;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🚀 Eerav's Math!</h1>
    <div class="stars">⭐ <span id="starN">0</span></div>
  </header>

  <!-- HOME -->
  <div id="home">
    <div class="grid" id="tiles"></div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button class="backbtn" onclick="goHome()">🏠</button>
        <span class="lvbadge" id="lvBadge">Level 1</span>
      </div>
      <div class="qtext" id="qText"></div>
      <div class="qbig" id="qBig"></div>
      <div class="choices" id="qChoices"></div>
      <button class="nextbtn" id="nextBtn" onclick="nextQ()">Next ➡️</button>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate"><div class="msg" id="celMsg">⭐</div></div>

<script>
/* ============ helpers ============ */
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const S=x=>String(x);
const MAXLV=5;
const LEVELUP=3; // correct-in-a-row to level up

function numChoices(answer){
  const sp=Math.max(3,Math.round(answer*0.25));
  const set=new Set([answer]);let g=0;
  while(set.size<4&&g<80){let d=answer+rand(-sp,sp);if(d<0)d=Math.abs(d);if(d!==answer)set.add(d);g++;}
  let k=answer+1;while(set.size<4){set.add(k++);}
  return shuffle([...set]).map(v=>({label:S(v),value:S(v)}));
}

/* ============ progress ============ */
const KEY='eeravMathProgress_v2';
let PROG=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d;}catch(e){}return{stars:0,levels:{}};}
function save(){localStorage.setItem(KEY,JSON.stringify(PROG));}
function refresh(){document.getElementById('starN').textContent=PROG.stars;}

const OBJS=['🍎','🐟','⭐','🎈','🐶','🍓','🚗','🌸','🐥','🍌','🐝','🦋','🍇','🦄'];
const SHAPES=[['circle','⚫'],['square','🟥'],['triangle','🔺'],['star','⭐'],['heart','❤️'],['diamond','🔷'],['blue','🟦'],['green','🟢']];
const CORNERS=[['🔺',3],['🟥',4],['🔷',4],['🟦',4],['⭐',5]];

/* ============ games (no pictures, no audio, 5 levels) ============ */
const GAMES={
  add(lv){
    let a,b,c=null;
    if(lv===1){a=rand(1,4);b=rand(1,4);}
    else if(lv===2){a=rand(2,6);b=rand(2,6);}
    else if(lv===3){a=rand(3,9);b=rand(4,10);}
    else if(lv===4){a=rand(2,6);b=rand(2,6);c=rand(1,6);}
    else{a=rand(11,29);b=rand(2,9);}
    const ans=a+b+(c||0);
    const big=c!=null?`${a} + ${b} + ${c} = ?`:`${a} + ${b} = ?`;
    return{text:'Add ➕',big,choices:numChoices(ans),answer:S(ans)};
  },
  subtract(lv){
    let a,b;
    if(lv===1){a=rand(2,6);b=rand(1,a-1);}
    else if(lv===2){a=rand(4,10);b=rand(1,a-1);}
    else if(lv===3){a=rand(8,18);b=rand(1,a-1);}
    else if(lv===4){a=rand(12,19);b=rand(3,9);}
    else{a=rand(20,39);b=rand(2,9);}
    const ans=a-b;
    return{text:'Take away ➖',big:`${a} − ${b} = ?`,choices:numChoices(ans),answer:S(ans)};
  },
  count(lv){
    let step,start;
    if(lv===1){step=1;start=rand(4,14);}
    else if(lv===2){step=2;start=rand(1,6)*2;}
    else if(lv===3){step=5;start=rand(1,5)*5;}
    else if(lv===4){step=10;start=rand(1,6)*10;}
    else{step=pick([2,5,10]);start=rand(2,7)*step;}
    const seq=[start,start+step,start+2*step];
    return{text:'What comes next?',big:`${seq.join('  ')}  ❓`,choices:numChoices(start+3*step),answer:S(start+3*step)};
  },
  numbers(lv){
    if(lv===1){const n=rand(3,19);return{text:'What comes after?',big:`${n}, ❓`,choices:numChoices(n+1),answer:S(n+1)};}
    if(lv===2){const n=rand(4,20);return{text:'What comes before?',big:`❓, ${n}`,choices:numChoices(n-1),answer:S(n-1)};}
    if(lv===3){const n=rand(4,18);return{text:'Missing number?',big:`${n}, ❓, ${n+2}`,choices:numChoices(n+1),answer:S(n+1)};}
    if(lv===4){const n=rand(10,40);return{text:'10 more?',big:`10 more than ${n}`,choices:numChoices(n+10),answer:S(n+10)};}
    const n=rand(20,50);return{text:'10 less?',big:`10 less than ${n}`,choices:numChoices(n-10),answer:S(n-10)};
  },
  compare(lv){
    const rng=lv<=2?10:lv===3?20:lv===4?50:99;
    let a=rand(1,rng),b=rand(1,rng);while(b===a)b=rand(1,rng);
    const bigger=(lv%2===1);
    const ans=bigger?(a>b?'A':'B'):(a<b?'A':'B');
    const choices=shuffle([{label:S(a),value:'A'},{label:S(b),value:'B'}]);
    return{text:bigger?'Which is more? ⬆️':'Which is less? ⬇️',big:'',choices,answer:ans};
  },
  shapes(lv){
    if(lv>=3){const s=pick(CORNERS);return{text:'How many corners?',big:`<span style="font-size:90px">${s[0]}</span>`,choices:numChoices(s[1]),answer:S(s[1])};}
    const set=lv<=1?SHAPES.slice(0,4):SHAPES;
    const target=pick(set),others=shuffle(set.filter(x=>x[0]!==target[0])).slice(0,3);
    const choices=shuffle([target,...others]).map(s=>({label:`<span style="font-size:56px">${s[1]}</span>`,value:s[0]}));
    return{text:'Match the shape!',big:`<span style="font-size:90px">${target[1]}</span>`,choices,answer:target[0]};
  },
  patterns(lv){
    const p=shuffle(OBJS).slice(0,3);let seq,next;
    if(lv===1){seq=[p[0],p[1],p[0],p[1]];next=p[0];}
    else if(lv===2){seq=[p[0],p[1],p[2],p[0],p[1]];next=p[2];}
    else if(lv===3){seq=[p[0],p[0],p[1],p[1],p[0],p[0]];next=p[1];}
    else if(lv===4){seq=[p[0],p[1],p[1],p[0],p[1],p[1]];next=p[0];}
    else{seq=[p[0],p[1],p[2],p[2],p[1],p[0],p[0],p[1]];next=p[2];}
    const vis=`${seq.map(x=>`<span style="font-size:40px">${x}</span>`).join(' ')} <span style="font-size:40px">❓</span>`;
    const opts=shuffle(p).map(x=>({label:`<span style="font-size:48px">${x}</span>`,value:x}));
    return{text:'What comes next?',big:vis,choices:opts,answer:next};
  }
};

const TILES=[
  {id:'add',emo:'➕',name:'Add',cls:'c3'},
  {id:'subtract',emo:'➖',name:'Take Away',cls:'c4'},
  {id:'count',emo:'🔢',name:'Skip Count',cls:'c1'},
  {id:'numbers',emo:'🔟',name:'Numbers',cls:'c2'},
  {id:'compare',emo:'⚖️',name:'More or Less',cls:'c5'},
  {id:'shapes',emo:'⭐',name:'Shapes',cls:'c6'},
  {id:'patterns',emo:'🎨',name:'Patterns',cls:'c7'}
];

/* ============ flow ============ */
const NAME='Eerav';
let current=null,level=1,correctRow=0,answer=null,locked=false;

function buildTiles(){const g=document.getElementById('tiles');g.innerHTML='';TILES.forEach(t=>{const lv=PROG.levels[t.id]||1;const b=document.createElement('button');b.className='tile '+t.cls;b.innerHTML=`<span class="emo">${t.emo}</span>${t.name}<span class="lvl">Level ${lv}</span>`;b.onclick=()=>openGame(t.id);g.appendChild(b);});}
function goHome(){document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden');buildTiles();refresh();}
function openGame(id){current=id;level=PROG.levels[id]||1;correctRow=0;document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');nextQ();}

function nextQ(){
  locked=false;
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('lvBadge').textContent='Level '+level;
  const item=GAMES[current](Math.min(level,MAXLV));
  answer=item.answer;
  document.getElementById('qText').textContent=item.text||'';
  document.getElementById('qBig').innerHTML=item.big||'';
  const box=document.getElementById('qChoices');box.innerHTML='';
  item.choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML=c.label;b.onclick=()=>answerQ(b,c.value);box.appendChild(b);});
}

function answerQ(btn,val){
  if(locked)return;
  if(val===answer){
    locked=true;
    document.querySelectorAll('#qChoices .choice').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    PROG.stars++;correctRow++;
    let leveled=false;
    if(correctRow>=LEVELUP&&level<MAXLV){level++;correctRow=0;leveled=true;PROG.levels[current]=level;}
    save();refresh();
    celebrate(leveled?('🚀 Level '+level+'!'):null);
    document.getElementById('nextBtn').classList.add('show');
  }else{
    btn.classList.add('wrong');btn.disabled=true;
    correctRow=0;
  }
}

const CELS=['⭐ Yay! ⭐','🎉 Great! 🎉','👏 Nice! 👏','🌟 Wow! 🌟','😃 Yes! 😃','🔥 Cool! 🔥'];
function celebrate(msg){
  const c=document.getElementById('celebrate');document.getElementById('celMsg').textContent=msg||pick(CELS);
  c.classList.add('show');
  for(let i=0;i<14;i++){const e=document.createElement('div');e.className='confetti';e.textContent=pick(['⭐','🎉','🌈','✨','🎈','💛']);e.style.left=rand(2,96)+'vw';e.style.animationDelay=(Math.random()*0.4)+'s';e.style.fontSize=rand(24,44)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
  setTimeout(()=>c.classList.remove('show'),1100);
}

/* ============ init ============ */
buildTiles();refresh();
</script>
</body>
</html>
